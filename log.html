<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動作ログ - TubeFolio</title>
<link rel="stylesheet" href="stats.css">
<script src="theme.js"></script>
<style>
  .lg-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .lg-tools input[type=search] { background: var(--chip); border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; width: 240px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--chip); border-radius: 14px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
  .chip small { opacity: .7; margin-left: 3px; }
  .log { font-size: 13px; }
  .row { display: grid; grid-template-columns: 64px 20px 92px 1fr; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .row:hover { background: var(--chip); }
  .row .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .c { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; background: var(--chip); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .m { word-break: break-word; line-height: 1.5; }
  .row.warn .m { color: #f9a825; }
  .row.error .m { color: #ef5350; font-weight: 600; }
  .row.warn { box-shadow: inset 3px 0 #f9a825; }
  .row.error { box-shadow: inset 3px 0 #ef5350; }
  .more[hidden] { display: none; }
  .day { padding: 10px 8px 4px; font-weight: 700; font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
  <header class="top">
    <div class="brand"><img class="logo-img" src="icons/icon48.png" alt="" width="30" height="30"><h1>動作ログ</h1></div>
    <span class="muted" id="sum"></span>
    <button class="small" id="copy">テキストでコピー</button>
    <button class="danger" id="clear">ログを消去</button>
  </header>
  <main>
    <section class="card">
      <div class="lg-tools">
        <div class="seg" id="lv"><button data-l="all" class="on">すべて</button><button data-l="warn">注意・エラーだけ</button></div>
        <input type="search" id="q" placeholder="ログを検索">
        <div class="chips" id="cats"></div>
      </div>
      <div class="log" id="log"></div>
      <button id="more" class="more" hidden>もっと見る</button>
      <p id="empty" class="empty" hidden>まだログはありません。</p>
    </section>
    <footer class="foot"><span class="muted">TubeFolio がバックグラウンドで行ったこと（Drive同期・新着確認・通知・履歴の取り込み・更新情報の取得など）を記録しています。新しい順・最大2000件。🖥＝バックグラウンド、▶＝YouTubeのタブ、📄＝拡張機能の画面。</span></footer>
  </main>
  <script src="shared.js"></script>
  <script src="log.js"></script>
</body>
</html>
