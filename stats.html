<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>視聴記録 - TubeFolio</title>
<link rel="stylesheet" href="stats.css">
<script src="theme.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><img class="logo-img" src="icons/icon48.png" alt="" width="30" height="30"><h1>視聴記録</h1></div>
    <div class="seg" id="period">
      <button data-p="1">今日</button><button data-p="7">7日</button><button data-p="30">30日</button><button data-p="90">90日</button><button data-p="0">すべて</button>
    </div>
    <div class="yth">
      <label class="toggle" title="YouTubeの「履歴」から、スマホ・テレビなど他の端末で見た動画も取り込みます（1時間ごと）">
        <input type="checkbox" id="ythOn"> 📱 YouTubeの履歴も取り込む
      </label>
      <button id="ythNow" class="small">今すぐ取り込む</button>
      <span id="ythMsg" class="muted"></span>
    </div>
    <button id="openLog" class="small" title="TubeFolioがバックグラウンドで行ったことの記録">📝 動作ログ</button>
    <label class="toggle" title="外部サービス Return YouTube Dislike の推定値を表示します">
      <input type="checkbox" id="ryd"> 👎 低評価（推定）
    </label>
  </header>

  <main>
    <section class="kpis" id="kpis"></section>

    <section class="card">
      <div class="card-h"><h2>日ごとの視聴時間</h2><span class="muted" id="dailyNote"></span></div>
      <div id="daily" class="daily"></div>
    </section>

    <div class="two">
      <section class="card">
        <div class="card-h"><h2>フォルダ別</h2><span class="muted">視聴時間</span></div>
        <div id="folders" class="hbars"></div>
      </section>
      <section class="card">
        <div class="card-h"><h2>よく見たチャンネル</h2><span class="muted">視聴時間 上位10</span></div>
        <div id="channels" class="hbars"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-h">
        <h2>見た動画</h2>
        <input id="q" type="search" placeholder="タイトル・チャンネルで検索">
        <select id="sort">
          <option value="last">最後に見た順</option>
          <option value="sec">視聴時間が長い順</option>
          <option value="views">再生数が多い順</option>
          <option value="likes">高評価数が多い順</option>
          <option value="rate">自分が評価した動画</option>
        </select>
        <span class="muted" id="count"></span>
      </div>
      <div class="tablewrap">
        <table id="videos">
          <thead><tr>
            <th class="c-when">最後に見た</th><th>動画</th><th class="c-prog">見た時間</th>
            <th class="num">再生数</th><th class="num">👍 高評価</th><th class="num ryd-col">👎 低評価<small>（推定）</small></th><th class="c-rate">あなた</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <button id="more" class="more" hidden>もっと見る</button>
      <p id="empty" class="empty" hidden>この期間の視聴記録はまだありません。<br>YouTubeで動画を再生すると、ここに記録されていきます。</p>
    </section>

    <footer class="foot">
      <span class="muted">記録はこのPCのブラウザ内に保存されます（最大5000本・Drive同期の設定に従う）。📱は YouTube の履歴から取り込んだ分で、見た日と「どこまで見たか」から視聴時間を推定しています（時刻は分からないため、その日の昼として表示）。低評価数は Return YouTube Dislike による推定値です。</span>
      <button id="clear" class="danger">視聴記録を消去</button>
    </footer>
  </main>
  <script src="shared.js"></script>
  <script src="stats.js"></script>
</body>
</html>
